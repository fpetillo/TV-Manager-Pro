<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Manager</title><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"></head>
<body><main class="shell manager-shell">
<header class="topbar"><div><p class="eyebrow">TV MANAGER</p><a class="brand-link" href="/dashboard">TV Manager</a><h1>Add a TV Show</h1><p class="subtitle">Search TV shows, find IMDb IDs, and add them to the replacement library.</p></div><nav class="nav"><a class="btn secondary" href="/manager">TV Manager</a><a class="btn blue" href="/import">Import SickChill</a></nav></header>

{% include "_nav.html" %}
<div class="command-dock"><button id="commandTrigger" class="command-trigger">⌘ Search TV Manager <kbd>/</kbd></button></div>
<div id="commandPalette" class="command-palette" hidden><div class="command-card">
  <input id="commandInput" autocomplete="off" placeholder="Search shows, episodes, pages, IDs…">
  <div id="commandResults"></div>
</div></div>

<section class="panel"><form id="searchForm" class="search"><div class="field grow"><label>TV show</label><input id="q" required placeholder="e.g. The Walking Dead"></div><div class="field year-field"><label>First-air year</label><input id="year" type="number" placeholder="Optional"></div><div class="field"><label for="metadataProvider">Search provider</label><select id="metadataProvider"><option value="tmdb">TMDb</option><option value="tvdb">TVDB</option></select></div><button class="primary">Search</button></form><div id="message" class="message"></div></section>
<p><a href="/metadata-sources">Configure metadata sources</a></p><section id="results" class="results"></section>

<footer class="app-version-footer"><span>TV Manager</span><strong>v{{ app_version }}</strong><a href="/about">About</a></footer></main><script src="/static/library_storage.js?v={{ app_version }}"></script><script src="/static/show_destination.js?v={{ app_version }}-folder-editor3"></script><script src="/static/app.js?v={{ app_version }}"></script><script src="/static/global.js?v={{ app_version }}"></script></body></html>
