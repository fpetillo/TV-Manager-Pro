<!doctype html><html data-theme="{{ ui_theme }}"><head><meta charset="utf-8"><link rel="icon" href="/static/icons/tv-manager.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0b1220"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Manager Login</title><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"><link rel="stylesheet" href="/static/themes.css?v={{ app_version }}"></head>
<body><main class="shell" style="max-width:520px;padding-top:10vh">
<section class="panel"><p class="eyebrow">TV MANAGER</p><h1>Sign in</h1>
<p class="muted">Browser authentication is enabled for this TV Manager installation.</p>
{% if error %}<div class="notice warn">{{ error }}</div>{% endif %}
<form method="post" class="form-grid" style="grid-template-columns:1fr">
<label>Username<input name="username" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="blue" type="submit">Sign in</button>
</form></section>
<footer class="app-version-footer"><span>TV Manager</span><strong>v{{ app_version }}</strong><a href="/about">About</a></footer></main></body></html>
