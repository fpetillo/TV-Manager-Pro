<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue</title><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"></head>
<body><main class="shell manager-shell"><header class="topbar"><div><p class="eyebrow">DOWNLOAD CONTROL</p><h1>Queue</h1><p class="subtitle">See episode and season-pack acquisitions from queue through download, import, failure and recovery.</p></div></header>{% include "_nav.html" %}
<div class="command-dock"><button id="commandTrigger" class="command-trigger">⌘ Search TV Manager <kbd>/</kbd></button></div>
<div id="commandPalette" class="command-palette" hidden><div class="command-card"><input id="commandInput" autocomplete="off" placeholder="Search shows, episodes, pages, IDs…"><div id="commandResults"></div></div></div>
<section class="panel"><div class="toolbar"><input id="queueSearch" placeholder="Filter queue…" class="grow"><select id="queueStatus"><option value="">All statuses</option><option>Found</option><option>Queued</option><option>Downloading</option><option>Downloaded</option>
<option>Importing</option><option>Failed</option><option>Blocked</option><option>Quarantined</option></select><button id="refreshQueue" class="secondary">Refresh</button></div><div id="queueList"></div></section>

<footer class="app-version-footer"><span>TV Manager</span><strong>v{{ app_version }}</strong><a href="/about">About</a></footer></main><script src="/static/queue.js?v={{ app_version }}"></script><script src="/static/global.js?v={{ app_version }}"></script></body></html>
