<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity & Downloads</title><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"></head>
<body><main class="shell manager-shell">
<header class="topbar"><div><p class="eyebrow">HISTORY</p><h1>Activity & Downloads</h1><p class="subtitle">See searches, queued releases, downloader activity, scheduler events and errors in one place.</p></div></header>

{% include "_nav.html" %}
<div class="command-dock"><button id="commandTrigger" class="command-trigger">⌘ Search TV Manager <kbd>/</kbd></button></div>
<div id="commandPalette" class="command-palette" hidden><div class="command-card">
  <input id="commandInput" autocomplete="off" placeholder="Search shows, episodes, pages, IDs…">
  <div id="commandResults"></div>
</div></div>

<div class="page-grid"><section class="panel col-6"><h2>Recent Activity</h2><div id="activity"></div></section><section class="panel col-6"><h2>Download Queue History</h2><div id="downloads"></div></section></div>

<footer class="app-version-footer"><span>TV Manager</span><strong>v{{ app_version }}</strong><a href="/about">About</a></footer></main><script src="/static/activity.js?v={{ app_version }}"></script><script src="/static/global.js?v={{ app_version }}"></script></body></html>
