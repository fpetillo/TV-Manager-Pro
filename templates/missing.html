<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missing & Wanted</title><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"></head>
<body><main class="shell manager-shell">
<header class="topbar"><div><p class="eyebrow">BACKLOG</p><h1>Missing & Wanted</h1><p class="subtitle">A focused queue of aired episodes that are still Wanted or Failed.</p></div></header>

{% include "_nav.html" %}
<div class="command-dock"><button id="commandTrigger" class="command-trigger">⌘ Search TV Manager <kbd>/</kbd></button></div>
<div id="commandPalette" class="command-palette" hidden><div class="command-card">
  <input id="commandInput" autocomplete="off" placeholder="Search shows, episodes, pages, IDs…">
  <div id="commandResults"></div>
</div></div>

<section class="panel"><div class="toolbar"><strong id="count">Loading…</strong><div class="spacer"></div><button id="runRecent" class="secondary">Run Recent Search</button><button id="runBacklog" class="blue">Run Backlog Search</button></div><div id="jobMsg" class="message"></div><div id="list" class="table-wrap"></div></section>

<footer class="app-version-footer"><span>TV Manager</span><strong>v{{ app_version }}</strong><a href="/about">About</a></footer></main><script src="/static/missing.js?v={{ app_version }}"></script><script src="/static/global.js?v={{ app_version }}"></script></body></html>
